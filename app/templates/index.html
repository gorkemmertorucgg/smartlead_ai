<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartLead AI - Akıllı Satış ve Destek Asistanı</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

    <!-- Ana Konteyner -->
    <div class="w-full max-w-4xl bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl overflow-hidden grid grid-cols-1 md:grid-cols-3">
        
        <!-- Sol Panel: Bilgi ve İletişim Formu -->
        <div class="p-6 bg-slate-900/50 border-b md:border-b-0 md:border-r border-slate-800 flex flex-col justify-between">
            <div>
                <div class="flex items-center gap-3 mb-4">
                    <div class="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center text-white font-bold text-lg shadow-lg shadow-blue-500/30">
                        <i class="fa-solid fa-robot"></i>
                    </div>
                    <div>
                        <h1 class="font-bold text-lg text-white">SmartLead AI</h1>
                        <p class="text-xs text-emerald-400 flex items-center gap-1">
                            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> Çevrimiçi Asistan
                        </p>
                    </div>
                </div>
                <p class="text-sm text-slate-400 mb-6 leading-relaxed">
                    Sorularınızı yapay zekâmıza sorabilir, size özel teklif ve detaylar için iletişim bilgilerinizi bırakabilirsiniz.
                </p>

                <!-- Lead Formu -->
                <form id="leadForm" class="space-y-3">
                    <h3 class="text-xs font-semibold text-slate-300 uppercase tracking-wider">İletişim Formu</h3>
                    <input type="text" id="leadName" placeholder="Adınız Soyadınız" required
                        class="w-full px-3 py-2 text-sm bg-slate-800 border border-slate-700 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 transition">
                    <input type="tel" id="leadPhone" placeholder="Telefon Numaranız" required
                        class="w-full px-3 py-2 text-sm bg-slate-800 border border-slate-700 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 transition">
                    <button type="submit"
                        class="w-full py-2.5 bg-blue-600 hover:bg-blue-500 active:bg-blue-700 text-white rounded-lg text-sm font-medium transition duration-200 shadow-md shadow-blue-600/30">
                        Bilgileri Gönder
                    </button>
                    <p id="leadStatus" class="text-xs text-center hidden"></p>
                </form>
            </div>

            <div class="mt-6 pt-4 border-t border-slate-800/80 text-center">
                <a href="/dashboard" class="text-xs text-slate-400 hover:text-blue-400 transition flex items-center justify-center gap-1">
                    <i class="fa-solid fa-chart-line"></i> Yönetim Paneline Git
                </a>
            </div>
        </div>

        <!-- Sağ Panel: Sohbet Alanı -->
        <div class="col-span-2 flex flex-col h-[520px] bg-slate-950/40">
            <!-- Mesaj Listesi -->
            <div id="chatMessages" class="flex-1 p-4 overflow-y-auto space-y-3">
                <div class="flex items-start gap-2.5">
                    <div class="w-7 h-7 rounded-lg bg-blue-600/20 text-blue-400 flex items-center justify-center text-xs flex-shrink-0">
                        <i class="fa-solid fa-robot"></i>
                    </div>
                    <div class="bg-slate-800 text-slate-200 text-sm px-4 py-2.5 rounded-2xl rounded-tl-sm max-w-[80%] border border-slate-700/50">
                        Merhaba! Ben SmartLead AI. Size nasıl yardımcı olabilirim?
                    </div>
                </div>
            </div>

            <!-- Mesaj Giriş Alanı -->
            <form id="chatForm" class="p-3 bg-slate-900 border-t border-slate-800 flex gap-2">
                <input type="text" id="userInput" placeholder="Mesajınızı yazın..." autocomplete="off" required
                    class="flex-1 px-4 py-2.5 text-sm bg-slate-800 border border-slate-700 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 transition">
                <button type="submit" id="sendBtn"
                    class="px-5 py-2.5 bg-blue-600 hover:bg-blue-500 text-white rounded-xl text-sm font-medium transition flex items-center justify-center">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </form>
        </div>

    </div>

    <script>
        const chatMessages = document.getElementById('chatMessages');
        const chatForm = document.getElementById('chatForm');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const leadForm = document.getElementById('leadForm');
        const leadStatus = document.getElementById('leadStatus');

        let conversationHistory = [];

        function appendMessage(sender, text) {
            const isUser = sender === 'user';
            const wrapper = document.createElement('div');
            wrapper.className = `flex items-start gap-2.5 ${isUser ? 'justify-end' : ''}`;

            const bubble = document.createElement('div');
            bubble.className = isUser 
                ? 'bg-blue-600 text-white text-sm px-4 py-2.5 rounded-2xl rounded-tr-sm max-w-[80%]'
                : 'bg-slate-800 text-slate-200 text-sm px-4 py-2.5 rounded-2xl rounded-tl-sm max-w-[80%] border border-slate-700/50 leading-relaxed';
            bubble.textContent = text;

            if (!isUser) {
                const icon = document.createElement('div');
                icon.className = 'w-7 h-7 rounded-lg bg-blue-600/20 text-blue-400 flex items-center justify-center text-xs flex-shrink-0';
                icon.innerHTML = '<i class="fa-solid fa-robot"></i>';
                wrapper.appendChild(icon);
            }

            wrapper.appendChild(bubble);
            chatMessages.appendChild(wrapper);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const message = userInput.value.trim();
            if (!message) return;

            appendMessage('user', message);
            userInput.value = '';
            userInput.disabled = true;
            sendBtn.disabled = true;

            try {
                const res = await fetch('/api/sohbet', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ mesaj: message, gecmis: conversationHistory })
                });

                const data = await res.json();
                if (data.basari) {
                    appendMessage('ai', data.cevap);
                    conversationHistory.push({ role: 'user', content: message });
                    conversationHistory.push({ role: 'assistant', content: data.cevap });
                } else {
                    appendMessage('ai', 'Hata: ' + (data.hata || 'Yanıt alınamadı.'));
                }
            } catch (err) {
                appendMessage('ai', 'Sunucuya bağlanırken bir hata oluştu.');
            } finally {
                userInput.disabled = false;
                sendBtn.disabled = false;
                userInput.focus();
            }
        });

        leadForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const isim = document.getElementById('leadName').value.trim();
            const telefon = document.getElementById('leadPhone').value.trim();

            leadStatus.classList.remove('hidden', 'text-emerald-400', 'text-rose-400');
            leadStatus.textContent = 'Kaydediliyor...';

            try {
                const res = await fetch('/api/leads', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ isim, telefon, mesaj: 'Web formu üzerinden kayıt.' })
                });

                const data = await res.json();
                if (data.basari) {
                    leadStatus.className = 'text-xs text-center text-emerald-400';
                    leadStatus.textContent = 'Bilgileriniz başarıyla kaydedildi!';
                    leadForm.reset();
                } else {
                    leadStatus.className = 'text-xs text-center text-rose-400';
                    leadStatus.textContent = data.hata || 'Kayıt başarısız.';
                }
            } catch (err) {
                leadStatus.className = 'text-xs text-center text-rose-400';
                leadStatus.textContent = 'Sunucu bağlantı hatası.';
            }
        });
    </script>
</body>
</html>
