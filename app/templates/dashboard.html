<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartLead AI - Yönetim Paneli</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-6">

    <div class="max-w-5xl mx-auto space-y-6">
        <!-- Başlık Barı -->
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 bg-slate-900 border border-slate-800 p-6 rounded-2xl">
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 rounded-xl bg-blue-600 flex items-center justify-center text-white text-xl">
                    <i class="fa-solid fa-users"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold text-white">Müşteri Adayları (Leads)</h1>
                    <p class="text-sm text-slate-400">Gelen iletişim formları ve toplanan bilgiler</p>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="fetchLeads()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 rounded-xl text-sm font-medium transition flex items-center gap-2">
                    <i class="fa-solid fa-arrows-rotate"></i> Yenile
                </button>
                <a href="/" class="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-xl text-sm font-medium transition flex items-center gap-2">
                    <i class="fa-solid fa-arrow-left"></i> Siteye Dön
                </a>
            </div>
        </div>

        <!-- İstatistik Kutusu -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl">
                <p class="text-xs font-semibold text-slate-400 uppercase">Toplam Kayıt</p>
                <p id="totalCount" class="text-3xl font-bold text-white mt-2">0</p>
            </div>
            <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl">
                <p class="text-xs font-semibold text-slate-400 uppercase">Sistem Durumu</p>
                <p class="text-sm font-medium text-emerald-400 mt-3 flex items-center gap-1.5">
                    <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> Veritabanı Aktif
                </p>
            </div>
            <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl">
                <p class="text-xs font-semibold text-slate-400 uppercase">Yapay Zekâ Sağlayıcı</p>
                <p class="text-sm font-medium text-blue-400 mt-3">Groq (Qwen 3.6)</p>
            </div>
        </div>

        <!-- Tablo Alanı -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-xl">
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm text-slate-300">
                    <thead class="bg-slate-800/60 text-xs uppercase text-slate-400 border-b border-slate-800">
                        <tr>
                            <th class="px-6 py-4">ID</th>
                            <th class="px-6 py-4">İsim Soyisim</th>
                            <th class="px-6 py-4">Telefon</th>
                            <th class="px-6 py-4">Mesaj</th>
                            <th class="px-6 py-4">Tarih</th>
                        </tr>
                    </thead>
                    <tbody id="leadsTableBody" class="divide-y divide-slate-800/60">
                        <tr>
                            <td colspan="5" class="px-6 py-8 text-center text-slate-500">Yükleniyor...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        async function fetchLeads() {
            const tableBody = document.getElementById('leadsTableBody');
            const totalCount = document.getElementById('totalCount');

            try {
                const res = await fetch('/api/leads');
                const data = await res.json();

                if (data.basari) {
                    totalCount.textContent = data.toplam;
                    
                    if (data.leadler.length === 0) {
                        tableBody.innerHTML = `<tr><td colspan="5" class="px-6 py-8 text-center text-slate-500">Henüz hiç kayıt bulunmuyor.</td></tr>`;
                        return;
                    }

                    tableBody.innerHTML = data.leadler.map(lead => `
                        <tr class="hover:bg-slate-800/40 transition">
                            <td class="px-6 py-4 font-mono text-xs text-slate-500">#${lead.id}</td>
                            <td class="px-6 py-4 font-medium text-white">${lead.isim}</td>
                            <td class="px-6 py-4 text-blue-400 font-mono">${lead.telefon}</td>
                            <td class="px-6 py-4 text-slate-400">${lead.mesaj || '-'}</td>
                            <td class="px-6 py-4 text-xs text-slate-500">${lead.tarih}</td>
                        </tr>
                    `).join('');
                }
            } catch (err) {
                tableBody.innerHTML = `<tr><td colspan="5" class="px-6 py-8 text-center text-rose-400">Veriler yüklenirken hata oluştu.</td></tr>`;
            }
        }

        // Sayfa yüklendiğinde verileri çek
        fetchLeads();
    </script>
</body>
</html>
